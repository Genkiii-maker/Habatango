<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#172033">
<title>はば単 熟語クイズ</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--ink:#182234;--muted:#6b7280;--line:#e5e9f0;--accent:#172033;--accent2:#3d5afe;--good:#12805c;--bad:#c23a3a;--shadow:0 14px 40px rgba(24,34,52,.08)}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;background:linear-gradient(180deg,#eef3f9 0,#f8fafc 46%,#f4f7fb 100%);color:var(--ink)}button,input,select{font:inherit}.wrap{max-width:760px;margin:auto;padding:18px 14px 34px}.hero{padding:18px 4px 12px}.eyebrow{font-size:12px;letter-spacing:.12em;color:var(--muted);font-weight:800}.hero h1{font-size:32px;line-height:1.08;margin:7px 0 6px}.hero p{margin:0;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:14px 0}.card{background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:16px}.stat b{display:block;font-size:25px;margin-top:4px}.stat span{font-size:12px;color:var(--muted)}.section-title{font-size:13px;font-weight:800;color:var(--muted);margin:18px 2px 8px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.row3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}.field label{display:block;font-size:12px;color:var(--muted);margin:0 0 5px}.field select,.field input{width:100%;border:1px solid var(--line);border-radius:13px;padding:11px 12px;background:white;color:var(--ink)}.primary,.secondary{width:100%;border:0;border-radius:15px;padding:14px 16px;cursor:pointer;font-weight:800}.primary{background:var(--accent);color:white}.secondary{background:#fff;border:1px solid var(--line);color:var(--ink)}.actions{display:grid;gap:9px;margin-top:13px}.quizTop{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);margin-bottom:9px}.bar{height:7px;background:#e9edf4;border-radius:999px;overflow:hidden}.fill{height:100%;background:var(--accent2);width:0;transition:.2s}.question{margin-top:18px;text-align:center;padding:26px 16px}.qmeta{font-size:12px;color:var(--muted);margin-bottom:10px}.qword{font-size:36px;font-weight:850;letter-spacing:.01em;line-height:1.2;word-break:break-word;white-space:pre-wrap}.qword-row{display:flex;align-items:center;justify-content:center;gap:10px}.fav-btn{width:46px;height:46px;flex:0 0 46px;border:1px solid var(--line);background:#fff;border-radius:14px;cursor:pointer;font-size:24px;line-height:1;display:inline-flex;align-items:center;justify-content:center}.fav-btn.active{background:#fff8dd;border-color:#f0cf63}.choice-reveal{margin-top:14px;border:1px solid var(--line);background:linear-gradient(180deg,#f8fafc,#eef3f8);border-radius:16px;padding:28px 16px;cursor:pointer;color:var(--muted);font-weight:800;font-size:16px;width:100%}.pos{font-size:12px;color:var(--muted);margin-top:8px}.answers{display:grid;gap:10px;margin-top:15px}.ans{padding:15px;border:1px solid var(--line);background:#fff;border-radius:15px;text-align:left;cursor:pointer;color:var(--ink);width:100%}.ans.correct{border-color:#93d8be;background:#effbf6;color:#116447}.ans.wrong{border-color:#f0aaaa;background:#fff4f4;color:#9e3030}.feedback{margin-top:12px;padding:14px;border-radius:15px;display:none;text-align:left}.feedback.show{display:block}.feedback.good{background:#effbf6;color:#116447}.feedback.bad{background:#fff4f4;color:#9e3030}.ex{margin-top:8px;font-size:13px;color:var(--muted);white-space:pre-wrap;line-height:1.55}.spell{display:flex;gap:8px;margin-top:14px}.spell input{flex:1;min-width:0;border:1px solid var(--line);border-radius:14px;padding:14px 13px}.mini{font-size:12px;color:var(--muted)}.review-word{display:flex;justify-content:space-between;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}.review-word:last-child{border-bottom:0}.review-word b{font-size:17px}.hidden{display:none!important}.section-toggle{width:100%;display:flex;align-items:center;justify-content:space-between;border:0;background:transparent;padding:0 2px 8px;color:var(--muted);font-size:13px;font-weight:800;cursor:pointer}.section-toggle .arrow{font-size:14px;transition:.15s}.section-toggle.open .arrow{transform:rotate(180deg)}
@media(max-width:560px){.hero h1{font-size:28px}.qword{font-size:31px}.row3{grid-template-columns:1fr 1fr}.row3 .field:last-child{grid-column:1/-1}.stats-home{grid-template-columns:1fr 1fr}}
</style>
</head>
<body><div class="wrap">
<section id="home">
  <div class="hero"><div class="eyebrow">HYOGO ENGLISH WORD QUIZ</div><h1>はば単 熟語クイズ</h1><p>熟語も、単語クイズと同じ操作感で練習しよう。</p></div>
  <a class="secondary" href="../index.html" style="display:block;text-align:center;text-decoration:none;margin:0 0 12px;">← はば単2500へ戻る</a>
  <div class="grid stats-home"><div class="card stat"><span>累計正答率</span><b id="accuracy">—</b></div><div class="card stat"><span>今日の練習数</span><b id="todayPractice">0</b></div></div>
  <div class="grid"><div class="card stat"><span>出題できる熟語数</span><b id="idiomCount">読込中</b></div><div class="card stat"><span>手動登録数</span><b id="manualCount">読込中</b></div></div>
  <div class="card">
    <div class="section-title" style="margin-top:0">出題モード</div><div class="row3">
      <div class="field"><label for="mode">形式</label><select id="mode"><option value="en-jp">英語 → 日本語</option><option value="jp-en">日本語 → 英語</option><option value="spell">スペル入力</option><option value="cloze">例文・熟語穴埋め</option></select></div>
      <div class="field"><label for="count">問題数</label><select id="count"><option>10</option><option>20</option><option>50</option><option>100</option><option value="all">全範囲</option></select></div>
    </div>
    <div class="section-title">表示設定</div><div class="row" style="margin-bottom:12px"><label style="display:flex;align-items:center;gap:10px;cursor:pointer"><input id="hideChoicesMode" type="checkbox" checked style="width:20px;height:20px">選択肢隠しモード</label></div>
    <div class="actions"><button class="primary" id="startBtn">テストを始める</button><button class="secondary" id="weakBtn">苦手熟語だけでテスト</button><button class="secondary" id="favoriteBtn">お気に入りだけでテスト</button></div>
    <div class="mini" style="margin-top:10px">※ 成績・苦手熟語・お気に入りは、このブラウザ内に保存されます。</div>
  </div>
  <button class="section-toggle" id="favoriteToggle" type="button"><span>お気に入り（0）</span><span class="arrow">▼</span></button><div class="card hidden" id="favoriteList"><div class="mini">まだありません。クイズ中の ☆ をタップすると追加できます。</div></div>
  <div class="section-title">苦手熟語</div><div class="card" id="weakList"><div class="mini">まだありません。間違えるとここに追加されます。</div></div>
</section>
<section id="quiz" class="hidden">
  <div class="quizTop"><span id="progressText">1 / 10</span><span id="scoreText">0問正解</span></div><div class="bar"><div id="barFill" class="fill"></div></div>
  <div class="card question"><div id="qmeta" class="qmeta"></div><div class="qword-row"><div id="qmain" class="qword"></div><button id="favBtn" class="fav-btn" type="button" aria-label="お気に入りに追加" title="お気に入り">☆</button></div><div id="qpos" class="pos">熟語</div>
    <button id="choiceReveal" class="choice-reveal" type="button">選択肢を表示</button><div id="answers" class="answers hidden"></div>
    <div id="spellBox" class="spell hidden"><input id="spellInput" autocomplete="off" autocapitalize="none" spellcheck="false" placeholder="英語表現を入力"><button class="primary" id="spellSubmit" style="width:auto;min-width:92px">回答</button></div>
    <div id="feedback" class="feedback"><b id="feedbackTitle"></b><div id="feedbackAnswer"></div><div id="feedbackEx" class="ex"></div></div>
  </div><div class="actions"><button class="secondary" id="quitBtn">テストを終了</button></div>
</section>
<section id="result" class="hidden">
  <div class="hero"><div class="eyebrow">RESULT</div><h1>テスト終了！</h1><p id="resultSub"></p></div>
  <div class="grid"><div class="card stat"><span>正解数</span><b id="resultCorrect">0</b></div><div class="card stat"><span>正答率</span><b id="resultAcc">0%</b></div></div>
  <div class="card"><div class="section-title" style="margin-top:0">今回の復習</div><div id="resultReview"></div></div>
  <div class="actions"><button class="primary" id="againBtn">同じ条件でもう一度</button><button class="secondary" id="homeBtn">ホームへ戻る</button></div>
</section></div>
<script src="../words/words01.js"></script><script src="../words/words02.js"></script><script src="../words/words03.js"></script><script src="../words/words04.js"></script><script src="../words/words05.js"></script><script src="../words/words06.js"></script><script src="../words/words07.js"></script><script src="../words/words08.js"></script><script src="../words/words09.js"></script><script src="../words/words10.js"></script><script src="../words/words11.js"></script><script src="../words/words12.js"></script><script src="../words/words13.js"></script><script src="../words/words14.js"></script><script src="../words/words15.js"></script><script src="../words/words16.js"></script><script src="../words/words17.js"></script><script src="../words/words18.js"></script><script src="../words/words19.js"></script><script src="../words/words20.js"></script><script src="../words/words21.js"></script><script src="../words/words22.js"></script><script src="../words/words23.js"></script><script src="../words/words24.js"></script><script src="../words/words25.js"></script><script src="idioms-manual.js"></script>
<script>
'use strict';
const WORDS=[...WORDS01,...WORDS02,...WORDS03,...WORDS04,...WORDS05,...WORDS06,...WORDS07,...WORDS08,...WORDS09,...WORDS10,...WORDS11,...WORDS12,...WORDS13,...WORDS14,...WORDS15,...WORDS16,...WORDS17,...WORDS18,...WORDS19,...WORDS20,...WORDS21,...WORDS22,...WORDS23,...WORDS24,...WORDS25];
const $=id=>document.getElementById(id);
function normalize(s){return String(s??'').normalize('NFKC').replace(/[’‘]/g,"'").replace(/[“”]/g,'"').replace(/[‐-‒–—−]/g,'-').replace(/\u00a0/g,' ').replace(/[ \t\r\n]+/g,' ').trim().toLowerCase();}
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function escapeRegExp(s){return String(s).replace(/[-/\\^$*+?.()|[\]{}]/g,'\\$&');}
function extractAutoIdioms(){const out=[];for(const w of WORDS){const chunks=String(w.meaning||'').matchAll(/※([^※\r\n]+)/gu);let index=0;for(const found of chunks){const chunk=found[1].trim();index++;if(!chunk)continue;const split=chunk.match(/^(.+?)[ \t　]+(?=～?[ぁ-んァ-ヶ一-龠])/u);if(!split)continue;const phrase=split[1].trim();const meaning=chunk.slice(split[0].length).trim();if(!phrase||!meaning)continue;out.push({id:'auto-'+w.no+'-'+index,phrase,meaning,example:'',source:w.word+'（No.'+w.no+'）',kind:'auto'});}}return out;}
function buildIdioms(){const map=new Map();for(const item of extractAutoIdioms())map.set(normalize(item.phrase),item);for(let i=0;i<(Array.isArray(MANUAL_IDIOMS)?MANUAL_IDIOMS.length:0);i++){const item=MANUAL_IDIOMS[i];if(!item||!item.phrase||!item.meaning)continue;map.set(normalize(item.phrase),{...item,id:'manual-'+(i+1),source:item.source||'手動登録',kind:'manual'});}return [...map.values()].filter(x=>normalize(x.phrase)&&normalize(x.meaning)).map(x=>({...x,key:normalize(x.phrase)})).sort((a,b)=>a.phrase.localeCompare(b.phrase));}
const IDIOMS=buildIdioms();
const MANUAL_KEYS=new Set((Array.isArray(MANUAL_IDIOMS)?MANUAL_IDIOMS:[]).filter(x=>x&&x.phrase).map(x=>normalize(x.phrase)));
const KEY='habatan2500-idiom-progress-v1',HIDE_KEY='habatan2500-idiom-hide-choices';
let state;try{state=JSON.parse(localStorage.getItem(KEY)||'null');}catch(e){state=null;}state=state||{answered:0,correct:0,wrong:{},favorites:{},dailyPractice:{}};state.wrong=state.wrong||{};state.favorites=state.favorites||{};state.dailyPractice=state.dailyPractice||{};
function todayKey(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');}
let cfg={mode:'en-jp',count:'10',filter:'all',hideChoices:true};const savedHide=localStorage.getItem(HIDE_KEY);if(savedHide!==null)cfg.hideChoices=savedHide==='1';$('hideChoicesMode').checked=cfg.hideChoices;
let quiz=[],qi=0,score=0,current=null,answered=false,choicesRevealed=false,lastSettings={mode:'en-jp',count:'10',filter:'all'};
const shuffle=list=>{const a=[...list];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
function save(){localStorage.setItem(KEY,JSON.stringify(state));updateHome();}
function updateHome(){$('accuracy').textContent=state.answered?Math.round(state.correct/state.answered*100)+'%':'—';$('todayPractice').textContent=(state.dailyPractice[todayKey()]||0).toLocaleString();renderFavorites();renderWeak();}
function renderFavorites(){const items=IDIOMS.filter(x=>state.favorites[x.key]).sort((a,b)=>a.phrase.localeCompare(b.phrase)).slice(0,20);$('favoriteToggle').querySelector('span:first-child').textContent='お気に入り（'+items.length+'）';$('favoriteList').innerHTML=items.length?items.map(x=>'<div class="review-word"><div><b>'+esc(x.phrase)+'</b><div class="mini">'+esc(x.meaning)+'</div></div><div class="mini">★</div></div>').join(''):'<div class="mini">まだありません。クイズ中の ☆ をタップすると追加できます。</div>';}
$('favoriteToggle').onclick=()=>{const hidden=$('favoriteList').classList.toggle('hidden');$('favoriteToggle').classList.toggle('open',!hidden);};
function renderWeak(){const items=Object.entries(state.wrong).filter(([,n])=>n>0).sort((a,b)=>b[1]-a[1]).map(([key,n])=>({item:IDIOMS.find(x=>x.key===key),count:n})).filter(x=>x.item).slice(0,12);$('weakList').innerHTML=items.length?items.map(x=>'<div class="review-word"><div><b>'+esc(x.item.phrase)+'</b><div class="mini">'+esc(x.item.meaning)+'</div></div><div class="mini">'+x.count+'回ミス</div></div>').join(''):'<div class="mini">まだありません。間違えるとここに追加されます。</div>';}
function makeClozeItem(item){const phrase=String(item.phrase||'').trim(),example=String(item.example||'').trim();if(!phrase||!example)return null;let re=new RegExp('(?<![A-Za-z0-9])'+escapeRegExp(phrase)+'(?![A-Za-z0-9])','i');if(!re.test(example)&&/^be\s+/i.test(phrase)){const rest=escapeRegExp(phrase.replace(/^be\s+/i,''));const beForms="(?:be|am|is|are|was|were|been|being|I'm|you're|he's|she's|it's|we're|they're)";re=new RegExp('(?<![A-Za-z0-9])'+beForms+'\\s+'+rest+'(?![A-Za-z0-9])','i');}if(!re.test(example))return null;return {...item,question:example.replace(re,'___'),kind:'cloze'};}
function buildPool(){let pool=cfg.mode==='cloze'?IDIOMS.map(makeClozeItem).filter(Boolean):[...IDIOMS];if(cfg.filter==='weak')pool=pool.filter(x=>state.wrong[x.key]>0);if(cfg.filter==='favorite')pool=pool.filter(x=>state.favorites[x.key]);return pool;}
function poolForChoices(){return cfg.mode==='cloze'?IDIOMS.map(makeClozeItem).filter(Boolean):IDIOMS;}
function getAnswerText(item){return cfg.mode==='en-jp'?item.meaning:item.phrase;}
function getQuestionText(item){if(cfg.mode==='cloze')return item.question;if(cfg.mode==='jp-en'||cfg.mode==='spell')return item.meaning;return item.phrase;}
function makeChoices(item){const source=poolForChoices(),seen=new Set([normalize(getAnswerText(item))]),out=[item];for(const x of shuffle(source.filter(y=>y.key!==item.key))){const text=normalize(getAnswerText(x));if(!text||seen.has(text))continue;seen.add(text);out.push(x);if(out.length===4)break;}return shuffle(out);}
function updateFavoriteButton(){const on=!!state.favorites[current&&current.key],b=$('favBtn');b.textContent=on?'★':'☆';b.classList.toggle('active',on);b.setAttribute('aria-label',on?'お気に入りから外す':'お気に入りに追加');b.setAttribute('aria-pressed',on?'true':'false');}
function updateChoiceReveal(){const hidden=!!cfg.hideChoices&&!choicesRevealed;$('choiceReveal').classList.toggle('hidden',!hidden||cfg.mode==='spell');$('answers').classList.toggle('hidden',hidden||cfg.mode==='spell');}
$('choiceReveal').onclick=e=>{e.stopPropagation();choicesRevealed=true;updateChoiceReveal();};
$('favBtn').onclick=e=>{e.stopPropagation();if(!current)return;if(state.favorites[current.key])delete state.favorites[current.key];else state.favorites[current.key]=true;save();updateFavoriteButton();};
$('hideChoicesMode').addEventListener('change',()=>{cfg.hideChoices=$('hideChoicesMode').checked;localStorage.setItem(HIDE_KEY,cfg.hideChoices?'1':'0');if(current&&!answered){choicesRevealed=false;updateChoiceReveal();}});
function startQuiz(filter){cfg.mode=$('mode').value;cfg.count=$('count').value;cfg.filter=filter||'all';lastSettings={mode:cfg.mode,count:cfg.count,filter:cfg.filter};const pool=buildPool();if(!pool.length){alert(cfg.mode==='cloze'?'穴埋めに使える例文付き熟語がありません。例文に熟語が含まれる熟語だけが出題されます。':'この条件では熟語がありません。');return;}const amount=cfg.count==='all'?pool.length:Math.min(Number(cfg.count),pool.length);quiz=shuffle(pool).slice(0,amount);qi=0;score=0;current=null;answered=false;$('home').classList.add('hidden');$('result').classList.add('hidden');$('quiz').classList.remove('hidden');showQuestion();}
$('startBtn').onclick=()=>startQuiz('all');$('weakBtn').onclick=()=>startQuiz('weak');$('favoriteBtn').onclick=()=>startQuiz('favorite');
function showQuestion(){answered=false;choicesRevealed=false;$('feedback').className='feedback';$('spellBox').classList.add('hidden');$('answers').innerHTML='';$('spellInput').value='';current=quiz[qi];updateFavoriteButton();$('progressText').textContent=(qi+1)+' / '+quiz.length;$('scoreText').textContent=score+'問正解';$('barFill').style.width=(qi/quiz.length*100)+'%';$('qmeta').textContent=current.source||'手動登録';$('qmain').textContent=getQuestionText(current);$('qpos').textContent=cfg.mode==='cloze'?'空所補充':'熟語';
 if(cfg.mode==='spell'){$('choiceReveal').classList.add('hidden');$('answers').classList.add('hidden');$('spellBox').classList.remove('hidden');updateChoiceReveal();$('spellInput').focus();}else{$('choiceReveal').classList.remove('hidden');updateChoiceReveal();for(const choice of makeChoices(current)){const b=document.createElement('button');b.className='ans';b.type='button';b.textContent=getAnswerText(choice);b.dataset.key=choice.key;b.addEventListener('click',()=>{if(answered)goNext();else answer(b,choice);});$('answers').appendChild(b);}}
}
function answer(button,choice){if(answered)return;finishAnswer(choice.key===current.key,button,getAnswerText(current));}
$('spellSubmit').onclick=()=>{if(answered){goNext();return;}finishAnswer(normalize($('spellInput').value)===normalize(current.phrase),null,current.phrase);};$('spellInput').addEventListener('keydown',e=>{if(e.key==='Enter')$('spellSubmit').click();});
function finishAnswer(ok,button,correct){answered=true;const today=todayKey();state.dailyPractice[today]=(state.dailyPractice[today]||0)+1;state.answered++;if(ok){score++;state.correct++;if(cfg.filter==='weak')delete state.wrong[current.key];}else state.wrong[current.key]=(state.wrong[current.key]||0)+1;save();if(button){$('answers').querySelectorAll('.ans').forEach(b=>{if(b.dataset.key===current.key)b.classList.add('correct');});if(!ok)button.classList.add('wrong');}$('feedback').className='feedback show '+(ok?'good':'bad');$('feedbackTitle').textContent=ok?'✅ 正解！':'❌ おしい！';$('feedbackAnswer').innerHTML=ok?'':'正解：<b>'+esc(correct)+'</b>';const detail=[];if(current.example)detail.push('例文：'+current.example);if(current.source)detail.push('出典：'+current.source);$('feedbackEx').textContent=detail.join('\n');$('scoreText').textContent=score+'問正解';$('barFill').style.width=((qi+1)/quiz.length*100)+'%';}
function goNext(){if(!answered)return;if(qi+1>=quiz.length)finishQuiz();else{qi++;showQuestion();}}
function finishQuiz(){$('quiz').classList.add('hidden');$('result').classList.remove('hidden');const accuracy=Math.round(score/quiz.length*100);$('resultCorrect').textContent=score+' / '+quiz.length;$('resultAcc').textContent=accuracy+'%';$('resultSub').textContent=accuracy===100?'パーフェクト！':accuracy>=80?'いい感じ！':'間違えた熟語をもう一度やってみよう。';const wrong=quiz.filter(x=>state.wrong[x.key]>0).slice(0,20);$('resultReview').innerHTML=wrong.length?wrong.map(x=>'<div class="review-word"><div><b>'+esc(x.phrase)+'</b><div class="mini">'+esc(x.meaning)+'</div></div></div>').join(''):'<div class="mini">今回のミスはありません！</div>';}
$('againBtn').onclick=()=>{$('mode').value=lastSettings.mode;$('count').value=lastSettings.count;startQuiz(lastSettings.filter);};$('homeBtn').onclick=()=>{$('result').classList.add('hidden');$('home').classList.remove('hidden');updateHome();};$('quitBtn').onclick=()=>{$('quiz').classList.add('hidden');$('home').classList.remove('hidden');updateHome();};
$('idiomCount').textContent=IDIOMS.length.toLocaleString();$('manualCount').textContent=MANUAL_KEYS.size.toLocaleString();updateHome();
</script></body></html>
