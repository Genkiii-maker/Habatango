<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#172033">
<title>はば単 熟語クイズ</title>
<style>
:root{--bg:#f4f7fb;--card:#fff;--ink:#182234;--muted:#6b7280;--line:#e5e9f0;--accent:#172033;--accent2:#3d5afe;--good:#12805c;--bad:#c23a3a;--shadow:0 14px 40px rgba(24,34,52,.08)}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;background:linear-gradient(180deg,#eef3f9 0,#f8fafc 46%,#f4f7fb 100%);color:var(--ink)}button,select{font:inherit}.wrap{max-width:760px;margin:auto;padding:18px 14px 34px}.hero{padding:18px 4px 12px}.eyebrow{font-size:12px;letter-spacing:.12em;color:var(--muted);font-weight:800}.hero h1{font-size:32px;line-height:1.08;margin:7px 0 6px}.hero p{margin:0;color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin:14px 0}.card{background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:20px;box-shadow:var(--shadow);padding:16px}.stat b{display:block;font-size:25px;margin-top:4px}.stat span{font-size:12px;color:var(--muted)}.section-title{font-size:13px;font-weight:800;color:var(--muted);margin:18px 2px 8px}.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field label{display:block;font-size:12px;color:var(--muted);margin:0 0 5px}.field select{width:100%;border:1px solid var(--line);border-radius:13px;padding:11px 12px;background:white;color:var(--ink)}.primary,.secondary{display:block;width:100%;border:0;border-radius:15px;padding:14px 16px;cursor:pointer;font-weight:800;text-align:center}.primary{background:var(--accent);color:white}.secondary{background:#fff;border:1px solid var(--line);color:var(--ink)}.actions{display:grid;gap:9px;margin-top:13px}.mini{font-size:12px;color:var(--muted)}.hidden{display:none!important}.quizTop{display:flex;justify-content:space-between;align-items:center;font-size:12px;color:var(--muted);margin:14px 0 9px}.bar{height:7px;background:#e9edf4;border-radius:999px;overflow:hidden}.fill{height:100%;background:var(--accent2);width:0;transition:.2s}.question{margin-top:18px;text-align:center;padding:26px 16px}.qmeta{font-size:12px;color:var(--muted);margin-bottom:10px}.qword{font-size:30px;font-weight:850;line-height:1.3;word-break:break-word;white-space:pre-wrap}.answers{display:grid;gap:10px;margin-top:20px}.ans{padding:15px;border:1px solid var(--line);background:#fff;border-radius:15px;text-align:left;cursor:pointer;color:var(--ink)}.ans.correct{border-color:#93d8be;background:#effbf6;color:#116447}.ans.wrong{border-color:#f0aaaa;background:#fff4f4;color:#9e3030}.ans:disabled{cursor:default}.feedback{margin-top:14px;padding:14px;border-radius:15px;display:none;text-align:left}.feedback.show{display:block}.feedback.good{background:#effbf6;color:#116447}.feedback.bad{background:#fff4f4;color:#9e3030}.detail{margin-top:8px;font-size:13px;line-height:1.55;color:var(--muted);white-space:pre-wrap}.result-big{font-size:46px;font-weight:900;letter-spacing:-.03em}.top-link{display:block;text-align:center;text-decoration:none;margin-bottom:12px}.error{background:#fff4f4;border:1px solid #f0aaaa;padding:12px;border-radius:12px;color:#9e3030}
@media(max-width:560px){.hero h1{font-size:28px}.qword{font-size:26px}.grid{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div class="wrap">
<section id="home">
  <div class="hero">
    <div class="eyebrow">HYOGO ENGLISH WORD QUIZ</div>
    <h1>はば単 熟語クイズ</h1>
    <p>はば単の「※」付き熟語＋手動登録した熟語をまとめて練習。</p>
  </div>
  <a class="secondary top-link" href="../index.html">← はば単2500へ戻る</a>
  <div class="grid">
    <div class="card stat"><span>出題できる熟語数</span><b id="idiomCount">読込中</b></div>
    <div class="card stat"><span>手動登録数</span><b id="manualCount">読込中</b></div>
  </div>
  <div class="card">
    <div class="section-title" style="margin-top:0">出題設定</div>
    <div class="row">
      <div class="field"><label for="direction">出題形式</label><select id="direction"><option value="en-jp">英語 → 日本語</option><option value="jp-en">日本語 → 英語</option></select></div>
      <div class="field"><label for="count">問題数</label><select id="count"><option value="10">10問</option><option value="20">20問</option><option value="50">50問</option><option value="all">全範囲</option></select></div>
    </div>
    <div class="actions"><button class="primary" id="startBtn">熟語テストを始める</button></div>
    <p class="mini" style="margin-bottom:0">※ 自動抽出分と手動登録分は、熟語が重複しないようにまとめて出題します。</p>
  </div>
  <p class="mini" style="margin:14px 4px 0">手動登録は <code>idiom/idioms-manual.js</code> を編集すると追加できます。</p>
</section>
<section id="quiz" class="hidden">
  <div class="quizTop"><span id="progressText">1 / 10</span><span id="scoreText">0問正解</span></div>
  <div class="bar"><div id="barFill" class="fill"></div></div>
  <div class="card question">
    <div id="qmeta" class="qmeta"></div>
    <div id="questionText" class="qword"></div>
    <div id="answers" class="answers"></div>
    <div id="feedback" class="feedback"><b id="feedbackTitle"></b><div id="answerDetail" class="detail"></div></div>
  </div>
  <div class="actions"><button class="primary hidden" id="nextBtn">次の問題</button><button class="secondary" id="quitBtn">テストを終了</button></div>
</section>
<section id="result" class="hidden">
  <div class="hero"><div class="eyebrow">RESULT</div><h1>熟語テスト終了！</h1><p id="resultSub"></p></div>
  <div class="card"><div class="mini">今回の正答率</div><div class="result-big" id="resultAcc">0%</div><p id="resultScore"></p></div>
  <div class="actions"><button class="primary" id="againBtn">同じ条件でもう一度</button><button class="secondary" id="homeBtn">設定画面へ戻る</button></div>
</section>
</div>
<script src="../words/words01.js"></script>
<script src="../words/words02.js"></script>
<script src="../words/words03.js"></script>
<script src="../words/words04.js"></script>
<script src="../words/words05.js"></script>
<script src="../words/words06.js"></script>
<script src="../words/words07.js"></script>
<script src="../words/words08.js"></script>
<script src="../words/words09.js"></script>
<script src="../words/words10.js"></script>
<script src="../words/words11.js"></script>
<script src="../words/words12.js"></script>
<script src="../words/words13.js"></script>
<script src="../words/words14.js"></script>
<script src="../words/words15.js"></script>
<script src="../words/words16.js"></script>
<script src="../words/words17.js"></script>
<script src="../words/words18.js"></script>
<script src="../words/words19.js"></script>
<script src="../words/words20.js"></script>
<script src="../words/words21.js"></script>
<script src="../words/words22.js"></script>
<script src="../words/words23.js"></script>
<script src="../words/words24.js"></script>
<script src="../words/words25.js"></script>
<script src="idioms-manual.js"></script>
<script>
'use strict';
const WORDS = [
  ...WORDS01, ...WORDS02, ...WORDS03, ...WORDS04, ...WORDS05,
  ...WORDS06, ...WORDS07, ...WORDS08, ...WORDS09, ...WORDS10,
  ...WORDS11, ...WORDS12, ...WORDS13, ...WORDS14, ...WORDS15,
  ...WORDS16, ...WORDS17, ...WORDS18, ...WORDS19, ...WORDS20,
  ...WORDS21, ...WORDS22, ...WORDS23, ...WORDS24, ...WORDS25
];
const $ = id => document.getElementById(id);
const normalize = s => String(s ?? '').normalize('NFKC').replace(/[’‘]/g,"'").replace(/[‐-‒–—−]/g,'-').replace(/[ \t\r\n]+/g,' ').trim().toLowerCase();
function escapeHTML(s){return String(s ?? '').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function extractAutoIdioms(){
  const out = [];
  for(const w of WORDS){
    const text = String(w.meaning || '');
    const chunks = text.matchAll(/※([^※\r\n]+)/gu);
    let index = 0;
    for(const found of chunks){
      const chunk = found[1].trim();
      index++;
      if(!chunk) continue;
      // 翻訳の直前にある空白を区切りとして、英語表現と日本語訳を分ける。
      const split = chunk.match(/^(.+?)[ \t　]+(?=～?[ぁ-んァ-ヶ一-龠])/u);
      if(!split) continue;
      const phrase = split[1].trim();
      const meaning = chunk.slice(split[0].length).trim();
      if(!phrase || !meaning) continue;
      out.push({
        id:`auto-${w.no}-${index}`,
        phrase,
        meaning,
        example:'',
        source:`${w.word}（No.${w.no}）`,
        kind:'auto'
      });
    }
  }
  return out;
}
function buildIdioms(){
  const map = new Map();
  for(const item of extractAutoIdioms()) map.set(normalize(item.phrase), item);
  // 手動登録は自動抽出より優先。意味の補正や登録済み熟語の上書きにも使える。
  for(let i=0;i<(Array.isArray(MANUAL_IDIOMS)?MANUAL_IDIOMS.length:0);i++){
    const item = MANUAL_IDIOMS[i];
    if(!item || !item.phrase || !item.meaning) continue;
    const key = normalize(item.phrase);
    map.set(key, {...item, id:`manual-${i+1}`, source:item.source || '手動登録', kind:'manual'});
  }
  return [...map.values()].sort((a,b)=>a.phrase.localeCompare(b.phrase));
}
const IDIOMS = buildIdioms();
const MANUAL_KEYS = new Set((Array.isArray(MANUAL_IDIOMS)?MANUAL_IDIOMS:[]).filter(x=>x&&x.phrase).map(x=>normalize(x.phrase)));
let quiz = [], qi = 0, score = 0, locked = false, lastSettings = {direction:'en-jp',count:'10'};
const shuffle = list => {const a=[...list]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} return a;};
function getPrompt(item){return $('direction').value==='en-jp'?item.phrase:item.meaning;}
function getAnswer(item){return $('direction').value==='en-jp'?item.meaning:item.phrase;}
function makeChoices(current){
  const out=[current], seen=new Set([normalize(getAnswer(current))]);
  for(const item of shuffle(IDIOMS.filter(x=>x.id!==current.id))){
    const key=normalize(getAnswer(item));
    if(!key||seen.has(key)) continue;
    seen.add(key);out.push(item);if(out.length===4)break;
  }
  return shuffle(out);
}
function startQuiz(){
  if(IDIOMS.length<1){alert('熟語が読み込めませんでした。wordsフォルダとidioms-manual.jsを確認してください。');return;}
  lastSettings={direction:$('direction').value,count:$('count').value};
  quiz=shuffle(IDIOMS);
  const n=lastSettings.count==='all'?quiz.length:Math.min(Number(lastSettings.count),quiz.length);
  quiz=quiz.slice(0,n);qi=0;score=0;locked=false;
  $('home').classList.add('hidden');$('result').classList.add('hidden');$('quiz').classList.remove('hidden');
  showQuestion();
}
function showQuestion(){
  locked=false;
  const item=quiz[qi];
  $('progressText').textContent=`${qi+1} / ${quiz.length}`;
  $('scoreText').textContent=`${score}問正解`;
  $('barFill').style.width=`${(qi/quiz.length)*100}%`;
  $('qmeta').textContent=$('direction').value==='en-jp'?'次の熟語の意味は？':'次の意味に合う英語表現は？';
  $('questionText').textContent=getPrompt(item);
  $('answers').innerHTML='';
  $('feedback').className='feedback';$('feedbackTitle').textContent='';$('answerDetail').textContent='';
  $('nextBtn').classList.add('hidden');
  for(const choice of makeChoices(item)){
    const button=document.createElement('button');
    button.className='ans';button.type='button';button.textContent=getAnswer(choice);
    button.addEventListener('click',()=>chooseAnswer(choice,button));
    $('answers').appendChild(button);
  }
}
function chooseAnswer(choice,button){
  if(locked)return;locked=true;
  const current=quiz[qi];
  const correct=normalize(getAnswer(choice))===normalize(getAnswer(current));
  if(correct)score++;
  for(const b of $('answers').querySelectorAll('button')){
    b.disabled=true;
    if(normalize(b.textContent)===normalize(getAnswer(current)))b.classList.add('correct');
  }
  if(!correct)button.classList.add('wrong');
  $('scoreText').textContent=`${score}問正解`;
  $('feedback').className=`feedback show ${correct?'good':'bad'}`;
  $('feedbackTitle').textContent=correct?'正解！':'おしい！';
  const details=[`熟語：${current.phrase}`,`意味：${current.meaning}`];
  if(current.example)details.push(`例文：${current.example}`);
  if(current.source)details.push(`出典：${current.source}`);
  $('answerDetail').textContent=details.join('\n');
  $('barFill').style.width=`${((qi+1)/quiz.length)*100}%`;
  $('nextBtn').classList.remove('hidden');
  $('nextBtn').textContent=qi===quiz.length-1?'結果を見る':'次の問題';
}
function finishQuiz(){
  $('quiz').classList.add('hidden');$('result').classList.remove('hidden');
  const percent=quiz.length?Math.round(score/quiz.length*100):0;
  $('resultAcc').textContent=`${percent}%`;
  $('resultSub').textContent=`${quiz.length}問中 ${score}問正解！`;
  $('resultScore').textContent=`${quiz.length-score}問を復習すると、さらに定着しそう！`;
}
$('startBtn').addEventListener('click',startQuiz);
$('nextBtn').addEventListener('click',()=>{if(!locked)return;if(qi<quiz.length-1){qi++;showQuestion();}else finishQuiz();});
$('quitBtn').addEventListener('click',()=>{if(confirm('テストを終了して設定画面に戻りますか？')){$('quiz').classList.add('hidden');$('home').classList.remove('hidden');}});
$('againBtn').addEventListener('click',()=>{$('direction').value=lastSettings.direction;$('count').value=lastSettings.count;startQuiz();});
$('homeBtn').addEventListener('click',()=>{$('result').classList.add('hidden');$('home').classList.remove('hidden');});
$('idiomCount').textContent=IDIOMS.length.toLocaleString();
$('manualCount').textContent=MANUAL_KEYS.size.toLocaleString();
</script>
</body>
</html>
