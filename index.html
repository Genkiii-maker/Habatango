<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#172033">
<title>はば単2500</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--text:#172033;--muted:#687386;--line:#e2e7f0;--accent:#536dfe;--good:#18a66a;--bad:#e55353}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif}
button,select,input{font:inherit}
button{cursor:pointer;border:0}
.app{max-width:760px;margin:auto;padding:18px 14px 40px}
header{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}
h1{font-size:28px;margin:0;font-weight:800}
.sub{color:var(--muted);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:16px;margin:12px 0;box-shadow:0 5px 20px rgba(20,30,60,.05)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
label{display:block;font-size:13px;color:var(--muted);margin-bottom:5px}
select,input{width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--text)}
.primary{width:100%;padding:13px;border-radius:13px;background:var(--accent);color:#fff;font-weight:700;font-size:16px;margin-top:12px}
.secondary{padding:10px 13px;border-radius:11px;background:#eef1f8;color:var(--text)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{text-align:center;padding:12px 5px;background:#f7f8fc;border-radius:13px}
.stat b{display:block;font-size:20px}.stat span{font-size:11px;color:var(--muted)}
.hidden{display:none!important}
.topline{display:flex;justify-content:space-between;align-items:center;color:var(--muted);font-size:13px}
.progress{height:7px;background:#e8ebf2;border-radius:99px;overflow:hidden;margin:10px 0 20px}
.progress>div{height:100%;background:var(--accent);width:0;transition:.2s}
.question{font-size:26px;font-weight:800;text-align:center;line-height:1.5;white-space:pre-wrap;word-break:break-word;padding:18px 5px}
.answers{display:grid;gap:9px}
.answer{width:100%;text-align:left;padding:13px;border:1px solid var(--line);border-radius:13px;background:#fff}
.answer:hover{background:#f5f7ff}
.answer.correct{border-color:var(--good);background:#ecfbf4}
.answer.wrong{border-color:var(--bad);background:#fff0f0}
.feedback{text-align:center;min-height:28px;font-weight:700;margin:10px 0}
.spellrow{display:flex;gap:8px}.spellrow input{flex:1}.spellrow button{padding:0 15px;border-radius:12px;background:var(--accent);color:#fff}
.choice-reveal{text-align:center;color:var(--muted);font-size:12px;margin:8px 0}
.result{text-align:center}.big{font-size:42px;font-weight:800}.review{margin-top:14px;text-align:left}
.review div{padding:9px 0;border-bottom:1px solid var(--line)}
.fav{background:none;color:#e2a400;font-size:22px;padding:2px 7px}
.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.check{display:flex;align-items:center;gap:7px;color:var(--muted);font-size:13px;margin-top:10px}.check input{width:auto}
@media(max-width:520px){.grid{grid-template-columns:1fr}.question{font-size:23px}}
</style>
</head>
<body>
<div class="app">
<header>
  <div><h1>はば単2500</h1><div class="sub">英単語トレーニング</div></div>
</header>

<section id="home">
  <div class="card">
    <div class="stats">
      <div class="stat"><b id="totalAnswered">0</b><span>回答数</span></div>
      <div class="stat"><b id="totalCorrect">0</b><span>正解数</span></div>
      <div class="stat"><b id="accuracy">0%</b><span>正答率</span></div>
    </div>
  </div>

  <div class="card">
    <div class="grid">
      <div><label>出題モード</label>
        <select id="mode">
          <option value="en-jp">英語 → 日本語</option>
          <option value="jp-en">日本語 → 英語</option>
          <option value="spell">スペル</option>
          <option value="cloze">例文・熟語穴埋め</option>
        </select>
      </div>

      <div><label>問題数</label>
        <select id="count">
          <option>10</option>
          <option>20</option>
          <option>50</option>
          <option>100</option>
          <option value="all">すべて</option>
        </select>
      </div>

      <div><label>範囲</label>
        <select id="range">
          <option value="all">1–2500</option>
          <option value="1-500">1–500</option>
          <option value="501-1000">501–1000</option>
          <option value="1001-1500">1001–1500</option>
          <option value="1501-2000">1501–2000</option>
          <option value="2001-2500">2001–2500</option>
          <option value="custom">指定</option>
        </select>
      </div>

      <div><label>フィルター</label>
        <select id="filter">
          <option value="all">すべて</option>
          <option value="star">★</option>
          <option value="circle">○</option>
          <option value="weak">苦手</option>
          <option value="favorite">お気に入り</option>
        </select>
      </div>
    </div>

    <div id="customRange" class="grid hidden" style="margin-top:10px">
      <div>
        <label>開始番号</label>
        <input id="from" type="number" min="1" max="2500" value="1">
      </div>
      <div>
        <label>終了番号</label>
        <input id="to" type="number" min="1" max="2500" value="2500">
      </div>
    </div>

    <label class="check">
      <input id="hideChoices" type="checkbox">
      選択肢を最初は隠す
    </label>

    <button id="startBtn" class="primary">スタート</button>
  </div>
</section>

<section id="quiz" class="hidden">
  <div class="card">
    <div class="topline">
      <span id="progress">1 / 10</span>
      <span id="score">0点</span>
    </div>

    <div class="progress">
      <div id="bar"></div>
    </div>

    <div class="row">
      <span></span>
      <button id="favBtn" class="fav">☆</button>
    </div>

    <div id="question" class="question"></div>

    <div id="choiceReveal" class="choice-reveal hidden">
      タップすると選択肢を表示
    </div>

    <div id="answers" class="answers"></div>

    <div id="spellBox" class="spellrow hidden">
      <input
        id="spellInput"
        autocomplete="off"
        autocapitalize="off"
        spellcheck="false"
      >
      <button id="spellSubmit">回答</button>
    </div>

    <div id="feedback" class="feedback"></div>

    <button id="nextBtn" class="primary hidden">
      次の問題
    </button>

    <button id="quitBtn" class="secondary" style="width:100%;margin-top:9px">
      終了
    </button>
  </div>
</section>

<section id="result" class="hidden">
  <div class="card result">
    <div class="sub">今回の結果</div>
    <div id="resultCorrect" class="big">0 / 0</div>
    <div id="resultAcc">0%</div>

    <div id="review" class="review"></div>

    <button id="againBtn" class="primary">
      もう一度
    </button>

    <button id="homeBtn" class="secondary" style="width:100%;margin-top:9px">
      ホームへ
    </button>
  </div>
</section>
</div>

<script src="words/words01.js"></script>
<script src="words/words02.js"></script>
<script src="words/words03.js"></script>
<script src="words/words04.js"></script>
<script src="words/words05.js"></script>
<script src="words/words06.js"></script>
<script src="words/words07.js"></script>
<script src="words/words08.js"></script>
<script src="words/words09.js"></script>
<script src="words/words10.js"></script>
<script src="words/words11.js"></script>
<script src="words/words12.js"></script>
<script src="words/words13.js"></script>
<script src="words/words14.js"></script>
<script src="words/words15.js"></script>
<script src="words/words16.js"></script>
<script src="words/words17.js"></script>
<script src="words/words18.js"></script>
<script src="words/words19.js"></script>
<script src="words/words20.js"></script>
<script src="words/words21.js"></script>
<script src="words/words22.js"></script>
<script src="words/words23.js"></script>
<script src="words/words24.js"></script>
<script src="words/words25.js"></script>

<script>
'use strict';

const WORDS = [
  ...WORDS01,
  ...WORDS02,
  ...WORDS03,
  ...WORDS04,
  ...WORDS05,
  ...WORDS06,
  ...WORDS07,
  ...WORDS08,
  ...WORDS09,
  ...WORDS10,
  ...WORDS11,
  ...WORDS12,
  ...WORDS13,
  ...WORDS14,
  ...WORDS15,
  ...WORDS16,
  ...WORDS17,
  ...WORDS18,
  ...WORDS19,
  ...WORDS20,
  ...WORDS21,
  ...WORDS22,
  ...WORDS23,
  ...WORDS24,
  ...WORDS25
];

function splitMeaningVariants(text) {
  const cleaned = String(text || '')
    .replace(/【活用】[^\n※]*/g, '')
    .trim();

  if (!cleaned) return [];

  const parts = cleaned
    .split(/(?=(?:^|\n)\s*[①②③④⑤⑥⑦⑧⑨⑩])/u)
    .map(x => x.trim())
    .filter(Boolean);

  return parts.length ? parts : [cleaned];
}

function normalize(text) {
  return String(text || '')
    .toLowerCase()
    .replace(/[’']/g, "'")
    .trim();
}

function isComparisonWord(w) {
  return /^(?:more|less|better|worse|higher|lower|older|younger|larger|smaller)$/i
    .test(String(w || ''));
}

function getConjugationEntries(w) {
  return [];
}

function buildEntries() {
  return WORDS.map((w, i) => ({
    ...w,
    no: Number(w.no ?? i + 1),
    meaning: String(w.meaning || ''),
    example: String(w.example || ''),
    star: !!w.star,
    circle: !!w.circle
  }));
}

const ENTRIES = buildEntries();

/*
  重い約62万文字の固定CLOZE配列を廃止。

  WORDSの例文から必要なときだけ
  穴埋め問題を自動生成する。
*/
const CLOZE = WORDS.flatMap(w => {
  const word = String(w.word || '').trim();
  const example = String(w.example || '').trim();

  if (!word || !example) return [];

  const escaped = word.replace(
    /[.*+?^${}()|[\]\\]/g,
    '\\$&'
  );

  let re;

  try {
    re = new RegExp(
      `(?<![A-Za-z0-9])${escaped}(?![A-Za-z0-9])`,
      'i'
    );
  } catch (e) {
    return [];
  }

  if (!re.test(example)) return [];

  return [{
    id: `${w.no}-cloze`,
    no: Number(w.no),
    word,
    star: !!w.star,
    circle: !!w.circle,
    pos: w.pos,
    meaning: w.meaning,
    example,
    question: example.replace(re, '___'),
    kind: 'cloze',
    sourceWord: word
  }];
});


const KEY = 'habatan2500-r3v2-progress';

let state =
  JSON.parse(localStorage.getItem(KEY) || 'null') ||
  {
    answered: 0,
    correct: 0,
    wrong: {},
    favorites: {}
  };

state.favorites = state.favorites || {};
state.wrong = state.wrong || {};

const $ = id => document.getElementById(id);

let cfg = {
  mode: 'en-jp',
  count: 10,
  range: 'all',
  filter: 'all',
  hideChoices: false
};

let quiz = [];
let qi = 0;
let score = 0;
let current = null;
let answered = false;
let choicesRevealed = false;

const HIDE_KEY = 'habatan2500-hide-choices';

const savedHide = localStorage.getItem(HIDE_KEY);

if (savedHide !== null) {
  cfg.hideChoices = savedHide === '1';
}

$('hideChoices').checked = cfg.hideChoices;


const shuffle = a => {
  a = [...a];

  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));

    [a[i], a[j]] = [a[j], a[i]];
  }

  return a;
};


function save() {
  localStorage.setItem(
    KEY,
    JSON.stringify(state)
  );

  updateHome();
}


function updateHome() {
  $('totalAnswered').textContent = state.answered;

  $('totalCorrect').textContent = state.correct;

  $('accuracy').textContent =
    state.answered
      ? Math.round(
          state.correct / state.answered * 100
        ) + '%'
      : '0%';
}


function rangeOK(no) {

  if (cfg.range === 'all') {
    return true;
  }

  if (cfg.range === 'custom') {
    return (
      no >= Number($('from').value) &&
      no <= Number($('to').value)
    );
  }

  const [a, b] =
    cfg.range.split('-').map(Number);

  return no >= a && no <= b;
}


function buildPool() {

  let p =
    cfg.mode === 'cloze'
      ? CLOZE
      : ENTRIES;

  p = p.filter(
    e => rangeOK(Number(e.no))
  );

  if (cfg.filter === 'star') {
    p = p.filter(e => e.star);
  }

  if (cfg.filter === 'circle') {
    p = p.filter(e => e.circle);
  }

  if (cfg.filter === 'weak') {
    p = p.filter(
      e => (state.wrong[e.word] || 0) > 0
    );
  }

  if (cfg.filter === 'favorite') {
    p = p.filter(
      e => state.favorites[e.word]
    );
  }

  return p;
}


function getMeaningText(e) {
  return (
    splitMeaningVariants(e.meaning).join(' / ') ||
    '意味データなし'
  );
}


function getQuestionText(e) {

  if (cfg.mode === 'en-jp') {
    return e.word;
  }

  if (cfg.mode === 'jp-en') {
    return getMeaningText(e);
  }

  if (cfg.mode === 'cloze') {
    return e.question || e.example;
  }

  return e.meaning || 'スペルを入力';
}


function getAnswerText(e) {

  if (cfg.mode === 'en-jp') {
    return getMeaningText(e);
  }

  return e.word;
}


function makeChoices() {

  const pool = buildPool();

  const answer = getAnswerText(current);

  const others =
    shuffle(
      pool.filter(
        e => e.word !== current.word
      )
    )
    .slice(0, 3)
    .map(getAnswerText);

  return shuffle([
    answer,
    ...others
  ]);
}


function updateFavoriteButton() {

  $('favBtn').textContent =
    state.favorites[current.word]
      ? '★'
      : '☆';
}


function showQuiz() {

  $('home').classList.add('hidden');

  $('result').classList.add('hidden');

  $('quiz').classList.remove('hidden');

  renderQuestion();
}


function renderQuestion() {

  current = quiz[qi];

  answered = false;

  choicesRevealed =
    !cfg.hideChoices;

  $('progress').textContent =
    `${qi + 1} / ${quiz.length}`;

  $('score').textContent =
    `${score}点`;

  $('bar').style.width =
    `${qi / quiz.length * 100}%`;

  $('question').textContent =
    getQuestionText(current);

  $('feedback').textContent = '';

  $('nextBtn')
    .classList
    .add('hidden');

  $('answers').innerHTML = '';

  $('spellBox')
    .classList
    .toggle(
      'hidden',
      cfg.mode !== 'spell'
    );

  $('answers')
    .classList
    .toggle(
      'hidden',
      cfg.mode === 'spell'
    );

  $('choiceReveal')
    .classList
    .toggle(
      'hidden',
      cfg.mode === 'spell' ||
      !cfg.hideChoices ||
      choicesRevealed
    );

  $('spellInput').value = '';

  updateFavoriteButton();


  if (cfg.mode !== 'spell') {

    const choices =
      makeChoices();

    choices.forEach((choice, i) => {

      const b =
        document.createElement('button');

      b.className = 'answer';

      b.textContent = choice;

      b.onclick = () =>
        answer(choice, b);

      $('answers')
        .appendChild(b);
    });


    if (
      cfg.hideChoices &&
      !choicesRevealed
    ) {

      $('answers')
        .classList
        .add('hidden');

      $('choiceReveal')
        .classList
        .remove('hidden');
    }

  } else {

    setTimeout(
      () => $('spellInput').focus(),
      50
    );
  }
}


function revealChoices() {

  if (answered) return;

  choicesRevealed = true;

  $('answers')
    .classList
    .remove('hidden');

  $('choiceReveal')
    .classList
    .add('hidden');
}


function answer(value, button = null) {

  if (answered) {
    nextQuestion();
    return;
  }

  answered = true;

  const correct =
    normalize(value) ===
    normalize(current.word);


  if (correct) {

    score++;

    state.correct++;

  } else {

    state.wrong[current.word] =
      (state.wrong[current.word] || 0) + 1;
  }


  state.answered++;

  save();


  if (button) {

    button.classList.add(
      correct
        ? 'correct'
        : 'wrong'
    );
  }


  if (!correct) {

    [
      ...$('answers').children
    ].forEach(b => {

      if (
        normalize(b.textContent) ===
        normalize(
          getAnswerText(current)
        )
      ) {

        b.classList.add('correct');
      }

    });
  }


  $('feedback').textContent =
    correct
      ? '正解！'
      : '不正解…  正解：' +
        current.word;


  $('score').textContent =
    `${score}点`;

  $('nextBtn')
    .classList
    .remove('hidden');
}


function nextQuestion() {

  if (!answered) return;

  qi++;

  if (qi >= quiz.length) {

    finish();

  } else {

    renderQuestion();
  }
}


function start() {

  cfg.mode = $('mode').value;

  cfg.count = $('count').value;

  cfg.range = $('range').value;

  cfg.filter = $('filter').value;

  cfg.hideChoices =
    $('hideChoices').checked;


  localStorage.setItem(
    HIDE_KEY,
    cfg.hideChoices
      ? '1'
      : '0'
  );


  const pool =
    shuffle(buildPool());


  if (!pool.length) {

    alert(
      '条件に合う問題がありません。範囲やフィルターを変更してください。'
    );

    return;
  }


  const n =
    cfg.count === 'all'
      ? pool.length
      : Math.min(
          Number(cfg.count),
          pool.length
        );


  quiz =
    pool.slice(0, n);

  qi = 0;

  score = 0;

  showQuiz();
}


function finish() {

  $('quiz')
    .classList
    .add('hidden');

  $('result')
    .classList
    .remove('hidden');


  $('resultCorrect').textContent =
    `${score} / ${quiz.length}`;


  $('resultAcc').textContent =
    `正答率 ${
      Math.round(
        score / quiz.length * 100
      )
    }%`;


  $('review').innerHTML = '';


  const wrong = quiz.filter(
    (e, i) => {

      /*
        今回の正誤を保存していないため、
        復習欄には表示しない。
      */

      return false;
    }
  );


  if (!wrong.length) {

    $('review').innerHTML =
      '<div style="color:var(--muted);text-align:center">' +
      'おつかれさま！' +
      '</div>';
  }
}


function goHome() {

  $('quiz')
    .classList
    .add('hidden');

  $('result')
    .classList
    .add('hidden');

  $('home')
    .classList
    .remove('hidden');

  updateHome();
}


$('startBtn').onclick = start;

$('quitBtn').onclick = goHome;

$('againBtn').onclick = start;

$('homeBtn').onclick = goHome;

$('nextBtn').onclick = nextQuestion;

$('choiceReveal').onclick =
  revealChoices;


$('range').onchange = () => {

  $('customRange')
    .classList
    .toggle(
      'hidden',
      $('range').value !== 'custom'
    );
};


$('favBtn').onclick = () => {

  if (!current) return;

  if (
    state.favorites[current.word]
  ) {

    delete state.favorites[
      current.word
    ];

  } else {

    state.favorites[
      current.word
    ] = true;
  }

  save();

  updateFavoriteButton();
};


$('spellSubmit').onclick = () =>
  answer(
    $('spellInput').value
  );


$('spellInput')
  .addEventListener(
    'keydown',
    e => {

      if (e.key === 'Enter') {

        answer(
          $('spellInput').value
        );
      }
    }
  );


updateHome();
</script>
</body>
</html>
